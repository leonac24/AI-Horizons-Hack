# Housing types compared on every lot. Code iterates over this list; nothing
# downstream names a typology. `use_key` links a typology to zoning rules in
# pipeline/zoning/rules_review.yaml.
#
# Form parameters are planning rules of thumb for a first pass
# (provenance: assumption) — see assumptions.yaml for the cost/carbon numbers.
#
# `building` is one placeable building in the 3D lot view:
#   footprint_ft  width (along the street) x depth, in feet
#   homes         homes in one building (assumption)
#   massing       which 3D shape to draw; the vocabulary lives in
#                 web/src/three/typologyMeshes.ts and is about geometry, not policy
#   body / roof   model colors
#   max_in_a_row  most of these buildings to line up along the frontage
#
# floor_height_ft is floor-to-floor. The zoning code caps height in feet
# while a typology is described in stories, so this is what lets the two be
# compared (see core/zoning.py, height_at_most).
#
# A typology's "pure" option on a lot is as many of its building as fit along
# the lot's frontage (up to max_in_a_row), so the homes counted in the ranking
# are exactly the homes the 3D view places. A form is also screened off a lot
# that is too small to hold it at all; that floor is derived from the building's
# own footprint and the `site_area_per_building_footprint` assumption, so it
# follows the footprint instead of being a separate number to keep in step.
# Add `min_lot_sf_for_form:` to a typology only to override that derivation.
typologies:
  - id: detached
    label: Detached house
    short_label: Detached
    color: "#ff9f1c"
    use_key: single_unit_detached
    unit_size_sf: 1400
    stories: 2
    floor_height_ft: 10
    tenure_default: owner
    building:
      footprint_ft: [26, 36]
      homes: 1
      massing: gable_house
      body: "#fff1d6"
      roof: "#ff7a1a"
      max_in_a_row: 1

  - id: adu_pair
    label: House + backyard unit (ADU)
    short_label: House + ADU
    color: "#ffc300"
    use_key: single_unit_detached_with_adu
    unit_size_sf: 1050
    stories: 2
    floor_height_ft: 10
    tenure_default: owner
    building:
      footprint_ft: [26, 64]
      homes: 2
      massing: house_with_rear_unit
      body: "#fff6c7"
      roof: "#f5b700"
      max_in_a_row: 1

  - id: two_unit
    label: Two-unit (duplex)
    short_label: Duplex
    color: "#ff5d8f"
    use_key: two_unit
    unit_size_sf: 1100
    stories: 2.5
    floor_height_ft: 10
    tenure_default: renter
    building:
      footprint_ft: [24, 46]
      homes: 2
      massing: gable_house_two_doors
      body: "#ffe0e8"
      roof: "#e8456f"
      max_in_a_row: 1

  - id: rowhouse
    label: Rowhouses / townhouses
    short_label: Rowhouse
    color: "#ff5a4e"
    use_key: single_unit_attached
    unit_size_sf: 1300
    stories: 3
    floor_height_ft: 10
    tenure_default: owner
    building:
      footprint_ft: [18, 38]
      homes: 1
      massing: flat_rowhouse
      body: "#f06b5b"
      roof: "#fff3e6"
      max_in_a_row: 6

  - id: small_multi
    label: Small apartment building (3–12)
    short_label: Small apartments
    color: "#1f8bff"
    use_key: multi_unit
    unit_size_sf: 800
    stories: 3
    floor_height_ft: 11
    tenure_default: renter
    supports_senior: true
    building:
      footprint_ft: [44, 56]
      homes: 9
      massing: walkup
      body: "#dcecff"
      roof: "#1f6fd1"
      max_in_a_row: 1

  - id: midrise
    label: Mid-rise apartments (13+)
    short_label: Mid-rise
    color: "#9b7bff"
    use_key: multi_unit
    unit_size_sf: 750
    stories: 5
    floor_height_ft: 11
    tenure_default: renter
    supports_senior: true
    building:
      footprint_ft: [64, 84]
      homes: 32
      massing: podium_midrise
      body: "#ece8ff"
      roof: "#5b43d6"
      max_in_a_row: 1
