name: Lotline
tagline: Pick any vacant lot in Pittsburgh. See who each housing option serves, what it costs, what it emits, and how the ranking changes with whose priorities you use.
disclaimer: >-
  Decision support only — not zoning, legal, or financial advice.
  Confirm with City of Pittsburgh Department of City Planning.
placeholder_notice: >-
  Hatched values are placeholders: a real source has not been connected yet.
  They show how the tool works, not what is true about this lot.
# Uncertainty draws inside the evidence engine (metric low/high bands).
# Separate from `smaa` below, which resamples in the browser for rank
# acceptability. Both live here so neither seed is a literal in code.
uncertainty:
  samples: 300
  seed: 20260926

# Server input limits. The API is public and unauthenticated; these are the
# ceilings that keep a hostile caller from turning it into a bill or a stall.
api:
  search_query_min_chars: 2
  search_query_max_chars: 64
  search_limit_max: 50
  # Longest a single id-style value in a URL may be, e.g. ?typology=rowhouse.
  # We look the value up in config right afterwards anyway, so this is only
  # here to stop someone pasting a megabyte of text into the address bar.
  id_param_max_chars: 64
  explain_max_weights: 64
  explain_max_ranking: 32
  # One budget per client IP, shared by every route that calls the model
  # (explain, ask, lot search).
  explain_requests_per_minute: 12
  # Free text a caller may send to the model: a question about a lot, or a
  # plain-English description of the lots they want.
  ask_question_max_chars: 300
  lot_search_query_max_chars: 200
  lot_search_results_max: 12
  analysis_cache_entries: 512
  # How long a browser is allowed to reuse an answer it already has before
  # asking us again. Answers only change when the config files change, so this
  # is safe to raise. The only cost of a bigger number: after you edit config,
  # someone with a warm cache keeps seeing the old answer for this many seconds.
  cache_max_age_seconds: 60
  work_backwards_max_units: 500
  # Most buildings a plan from the 3D lot view may contain.
  plan_max_buildings: 60
  target_ami_pct_max: 200

smaa:
  samples: 2000
  seed: 20260926
  # Dirichlet concentration when centering on a stakeholder profile (higher = tighter).
  profile_concentration: 40
  # Leverage re-runs SMAA once per criterion plus a baseline, so it uses a smaller
  # draw count than the headline bars. It only has to put the open questions in
  # order, and every run is paired on the one seed above, so most of the sampling
  # noise cancels out of the difference.
  leverage_samples: 600
  # Below this much change in the leader's first-place share, settling a question
  # counts as changing nothing. Roughly the noise floor at the draw count above:
  # sqrt(0.25 / 600) is about 0.02.
  leverage_epsilon: 0.02
explanation:
  max_sentences: 6
  # Restating given numbers is light work; low effort keeps the click responsive.
  effort: low
  timeout_s: 30
  max_tokens: 4000
# "Ask about this lot": starter questions shown as one-click chips. Answers use
# the explanation settings above and pass the same grounding check.
ask:
  # Placeholder hint under the plain-English lot search on the city map.
  search_example: big publicly held lots in Hazelwood, not on a steep slope
  examples:
    - Could a home health aide afford any of these?
    - Why does the top option rank first?
    - Which option has the lowest carbon per household?
    - What would change the ranking?
# Topics the offline Laya compile sorts source passages into, and the choices in
# the "What we don't know" source filter. Descriptions are what Laya is asked, so
# editing one changes the question hash and requires a recompile.
evidence:
  question: Which Lotline input does this passage most directly address? Choose other if none applies.
  topics:
    zoning: { label: Zoning, description: "Land use, permitted housing, dimensions, or zoning approval" }
    transit_jobs: { label: Transit access to jobs, description: Jobs reachable by transit or transit travel time }
    carbon: { label: Carbon, description: "Building energy, embodied carbon, electricity, or travel emissions" }
    housing_need: { label: Housing need, description: Housing affordability or income-specific housing need }
    sewer: { label: Sewer, description: "Sewer overflow, sewer sheds, or available sewer capacity" }
    cost: { label: Costs, description: "Construction, operating, financing, or subsidy costs" }
    site: { label: Site conditions, description: "Parcel geometry, flood, slope, mine, or other site condition" }
    other: { label: Other, description: None of these inputs, listed: false }
# First-run walk-through. `city` plays on the first visit; `lot` plays the first
# time someone opens a lot. "Skip tutorial" skips both; the ? button in the top
# bar replays the chapter for the screen you're on. `target` names a
# `data-tour` anchor in the UI; leave it out for a centered card. A missing
# anchor (e.g. an empty list) also falls back to a centered card.
tutorial:
  storage_key: lotline.tutorial.v1
  chapters:
    city:
      - title: Welcome to Lotline
        body: >-
          Pick any vacant lot in Pittsburgh, try housing on it, and see who it
          houses, what it costs, what it emits and what the zoning allows.
          This short tour shows you around. You can skip it any time.
      - target: map-hint
        title: The whole city, in 3D
        body: >-
          Every dot on the map is a vacant lot. Drag to orbit, right-drag to
          pan, scroll to zoom. Click any lot to zoom in on it.
        touch_body: >-
          Every dot on the map is a vacant lot. Drag one finger to orbit, pinch
          to zoom, drag two fingers to pan. Tap any lot to zoom in on it.
      - target: ai-search
        title: Describe what you're looking for
        body: >-
          Type the kind of lot you want in plain English. AI turns it into map
          filters and shows you exactly which filters it used.
      - target: filters
        title: Or filter by hand
        body: >-
          Search an address or parcel ID, pick a zoning district, set a minimum
          lot size, or hide lots on steep slopes and flood zones.
      - target: legend
        title: Read the dots
        body: >-
          Yellow pins are suggested lots and search hits. The key shows which
          dot color means publicly held and which means other vacant lots.
      - target: lot-cards
        title: Start from a suggested lot
        body: >-
          These are spread across neighborhoods, zoning districts and site
          conditions so you can see variety. They are starting points, not
          recommendations. Click one to open it.
        touch_body: >-
          These are spread across neighborhoods, zoning districts and site
          conditions so you can see variety. They are starting points, not
          recommendations. Tap one to open it.
      - target: help-button
        title: Stuck? Look for the ?
        body: >-
          Small ? buttons next to headings explain that part of the screen.
          This button replays the tour for whatever screen you're on.
    lot:
      - title: You're on a lot
        body: >-
          This is your sandbox. Place buildings, then compare your plan against
          every housing type Lotline screens. A quick tour of this screen.
      - target: palette
        title: Build
        body: >-
          Drag a housing type onto the outlined lot. Cards marked "too big"
          don't fit this lot's shape. Select a building to rotate (R) or
          delete it (Del).
        touch_body: >-
          Tap a housing type to add it to the lot, or drag it up onto the lot
          to place it yourself. Cards marked "too big" don't fit this lot's
          shape. Tap a building to rotate or delete it.
      - target: hud
        title: Your scoreboard
        body: >-
          Homes, zoning status, rank under the current priorities, carbon per
          household and the subsidy gap update as you build.
      - target: plan-controls
        title: Before and after
        body: >-
          Flip between the lot as it is today and your plan. Undo, redo, clear
          the lot or reset the camera here.
      - target: back
        title: Back to the map
        body: >-
          Done with this lot? Go back to the city map to pick another one.
      - target: tabs
        title: Dig into the tradeoffs
        body: >-
          Compare ranks the options. Next steps lists what to do about this
          lot. Whose priorities? changes the weights.
          Households, Carbon and Work backwards go deeper. What we don't know
          lists every gap in the data.
      - target: presets
        title: Whose priorities?
        body: >-
          Pink is always values, never evidence. Pick a stakeholder preset and
          watch the ranking shift. The numbers stay the same; only how they're
          weighed changes.
      - target: memo
        title: Take it to a meeting
        body: >-
          Print a one-page memo of this lot for a community meeting or a
          conversation with City Planning.
      - target: help-button
        title: That's it
        body: >-
          Decision support only. Confirm with the City of Pittsburgh Department
          of City Planning. Click ? next to any heading if you need a hand.
        touch_body: >-
          Decision support only. Confirm with the City of Pittsburgh Department
          of City Planning. Tap ? next to any heading if you need a hand.

# Every panel has a ▾ button that tucks it away to its header. The browser
# remembers the choice under `storage_key`. At or below `narrow_max_px` wide
# (phones) panels become full-width sheets and the top bar's actions move into a
# Tools dropdown.
panels:
  storage_key: lotline.panels.v1
  narrow_max_px: 720

# Text for the small ? buttons. Keys are the ids the UI asks for.
help:
  pick_lot:
    title: Picking a lot
    body: >-
      Click any dot on the map, search an address or parcel ID, or start from a
      suggested lot. Every vacant lot inside City of Pittsburgh limits works.
    touch_body: >-
      Tap any dot on the map, search an address or parcel ID, or start from a
      suggested lot. Every vacant lot inside City of Pittsburgh limits works.
  ai_search:
    title: AI lot search
    body: >-
      Describe the lots you want in your own words. AI turns your words into
      the same filters you could set by hand and lists them, so you can check
      what it understood. The largest matching lots are shown first.
  filters:
    title: Filters
    body: >-
      Filters change which dots show on the map. Hazard filters hide lots with
      that flag; a lot whose flood location couldn't be matched stays visible.
  legend:
    title: Map colors
    body: >-
      Pins are suggested lots or search results. Dots are split into publicly
      held lots and all other vacant lots; the key shows which color is which.
  suggested:
    title: Suggested lots
    body: >-
      Picked automatically to cover different neighborhoods, zoning districts,
      slopes and flood exposure. They are examples, not recommendations.
  hud:
    title: Scoreboard
    body: >-
      A live summary of your plan: homes placed, zoning status, rank under the
      current priorities, carbon per household by the year on the Carbon tab,
      and the subsidy per home needed at the income level on Work backwards.
  palette:
    title: Building palette
    body: >-
      Drag a card onto the lot. Each card shows homes per building, stories and
      footprint. A building turns red when it is off the lot, overlapping
      another, or crossing a setback.
    touch_body: >-
      Tap a card to add that building to the lot, or drag it up onto the lot.
      Each card shows homes per building, stories and footprint. A building
      turns red when it is off the lot, overlapping another, or crossing a
      setback.
  plan_controls:
    title: Plan controls
    body: >-
      Before shows the lot today; After shows your plan. Undo and redo step
      through your edits (Ctrl/⌘ Z). Clear lot removes every building.
    touch_body: >-
      Before shows the lot today; After shows your plan. Undo and redo step
      through your edits. Clear lot removes every building. On a phone these
      are under Tools.
  your_plan:
    title: Your plan
    body: >-
      How what you placed does on zoning and each criterion. Bars show the
      uncertainty range; the tick is the central estimate. Box style shows
      where a number comes from: solid observed, dashed modeled, outlined
      assumption, hatched placeholder.
  ranking:
    title: Ranking
    body: >-
      Options that fail a verified zoning requirement are left out of the
      ranking, not scored low. The rest are scored 0–1 on each criterion and
      weighted by the current priorities. Place copies an option onto the lot.
  flip:
    title: What would flip it
    body: >-
      The smallest change to one weight that would swap the top two. If a small
      change flips it, the ranking depends mostly on values, not evidence.
  smaa:
    title: How often it comes out on top
    body: >-
      Lotline reruns the ranking thousands of times with weights near yours and
      every number drawn from its range. A long first bar means the result
      holds up; a short one means it's a close call.
  ask:
    title: Ask about this lot
    body: >-
      Ask a question in plain English. Answers use only the numbers on this
      page, cite them as chips, and are checked before you see them.
  about_lot:
    title: About this lot
    body: >-
      Site context such as slope, flood and sewer flags. Being near a sewer,
      school or stop is not evidence of spare capacity.
  priorities:
    title: Priorities
    body: >-
      Weights say how much each criterion matters to you. Presets are
      illustrative starting points. Moving a slider switches to a custom
      profile. Weights never change the evidence.
  households:
    title: Households
    body: >-
      Illustrative households, not real people. Each is checked against each
      option: could they afford it at 30% of income?
  carbon_over_time:
    title: Carbon
    body: >-
      Materials at year 0, then home energy and travel each year, per
      household. Drag the year slider to see when one option overtakes
      another.
  backwards:
    title: Work backwards
    body: >-
      Pick a target housing type, number of homes and income level. See which
      zoning rules it would fail and how much subsidy per home it would need.
  next_steps:
    title: Next steps
    body: >-
      Actions for this lot, worked out from its ownership, zoning and site
      flags, and who to ask. AI can draft outreach that opens in your own
      email to edit; nothing is sent from here.
  unknowns:
    title: What we don't know
    body: >-
      Every placeholder, missing zoning rule and data gap in one place. Read
      this before relying on any result.
