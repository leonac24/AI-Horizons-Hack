# Scoring criteria. Every criterion must be scenario-dependent AND independent:
# it has to be able to change the ranking between housing types on the same lot,
# and it must not be a restatement of another criterion.
#
# Lot-level context that is identical across scenarios is shown separately as
# "site context" and is deliberately NOT a criterion — weighting a constant
# cannot move a ranking, it only dilutes the weights that can.
#
# Removed 2026-09-26: `opportunity` (households gaining transit access to jobs).
# It was units x jobs_access_index, and jobs_access_index is a property of the
# lot, not of the scenario. Within one lot it was therefore a positive constant
# times unit count -- exactly the negative of `infrastructure` after
# normalization -- so the two cancelled and only their weight difference did any
# work. Transit access is still computed and shown as site context
# (site.jobs_access). If a future access measure varies by housing type, add it
# back here.
#
# direction: higher_is_better | lower_is_better
criteria:
  - id: demand_fit
    metric_id: demand.units_serving_need
    label: Homes affordable to nearby cost-burdened renters
    question: How many proposed homes might be affordable to cost-burdened renters, under the stated tract-level independence assumption?
    direction: higher_is_better
    group: equity
    default_weight: 1

  - id: feasibility
    metric_id: feasibility.zoning_score
    label: Zoning path
    question: How hard is the approval path under the Zoning Code?
    direction: higher_is_better
    group: feasibility
    default_weight: 1

  - id: affordability
    metric_id: affordability.ami_needed_pct
    label: Income needed to afford a home
    question: What share of area median income does a household need to afford one of these homes without subsidy?
    direction: lower_is_better
    group: equity
    default_weight: 1

  # Renamed 2026-09-26 from `displacement` / displacement.pressure_units, and
  # changed from a count of homes to a share.
  #   - It is NOT an estimate of households displaced. No causal or longitudinal
  #     method stands behind it and the old name claimed one.
  #   - A count multiplied three placeholders together (units x tract cost burden
  #     x affordability ratio) and reported the product in whole homes. A share
  #     drops the invented magnitude and keeps the comparison the evidence
  #     actually supports.
  - id: local_affordability_gap
    metric_id: affordability_gap.share_above_local_rents
    label: Nearby renters below required income
    question: What share of nearby renter households have income below the scenario's required income?
    direction: lower_is_better
    group: equity
    default_weight: 1

  - id: infrastructure
    metric_id: infrastructure.load_index
    label: Added wastewater or infrastructure screen
    question: What added design flow is estimated, or what provisional load screen applies when flow data are missing?
    direction: lower_is_better
    group: feasibility
    default_weight: 1

  # Label carries no horizon: the horizon is assumptions.analysis_years and the
  # engine templates the metric label off it. A literal here would go stale.
  - id: carbon
    metric_id: carbon.per_household_horizon
    label: Carbon scenario per household
    question: Tonnes CO2e per household over the analysis horizon for the disclosed components and assumptions.
    direction: lower_is_better
    group: climate
    default_weight: 1
