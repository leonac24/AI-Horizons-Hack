# Scoring criteria. Every criterion must be scenario-dependent AND independent:
# it has to be able to change the ranking between housing types on the same lot,
# and it must not be a restatement of another criterion.
#
# Lot-level context that is identical across scenarios is shown separately as
# "site context" and is deliberately NOT a criterion — weighting a constant
# cannot move a ranking, it only dilutes the weights that can.
#
# Removed 2026-09-26: `opportunity` (households gaining transit access to jobs).
# It was units x jobs_access_index, and jobs_access_index is a property of the
# lot, not of the scenario. Within one lot it was therefore a positive constant
# times unit count -- exactly the negative of `infrastructure` after
# normalization -- so the two cancelled and only their weight difference did any
# work. Transit access is still computed and shown as site context
# (site.jobs_access). If a future access measure varies by housing type, add it
# back here.
#
# direction: higher_is_better | lower_is_better
criteria:
  - id: demand_fit
    metric_id: demand.units_serving_need
    label: Serves local housing need
    question: How many new homes land at the income levels this area is short on?
    direction: higher_is_better
    group: equity
    default_weight: 1

  - id: feasibility
    metric_id: feasibility.zoning_score
    label: Zoning path
    question: How hard is the approval path under the Zoning Code?
    direction: higher_is_better
    group: feasibility
    default_weight: 1

  - id: affordability
    metric_id: affordability.ami_needed_pct
    label: Income needed to afford a home
    question: What share of area median income does a household need to afford one of these homes without subsidy?
    direction: lower_is_better
    group: equity
    default_weight: 1

  # Renamed 2026-09-26 from `displacement` / displacement.pressure_units, and
  # changed from a count of homes to a share.
  #   - It is NOT an estimate of households displaced. No causal or longitudinal
  #     method stands behind it and the old name claimed one.
  #   - A count multiplied three placeholders together (units x tract cost burden
  #     x affordability ratio) and reported the product in whole homes. A share
  #     drops the invented magnitude and keeps the comparison the evidence
  #     actually supports.
  - id: local_affordability_gap
    metric_id: affordability_gap.share_above_local_rents
    label: Share priced above nearby renter incomes
    question: What share of these homes would cost more than renters nearby can currently pay?
    direction: lower_is_better
    group: equity
    default_weight: 1

  - id: infrastructure
    metric_id: infrastructure.load_index
    label: Strain on stressed infrastructure
    question: How much load does this add at a site with slope, landslide, or sewer constraints?
    direction: lower_is_better
    group: feasibility
    default_weight: 1

  # Label carries no horizon: the horizon is assumptions.analysis_years and the
  # engine templates the metric label off it. A literal here would go stale.
  - id: carbon
    metric_id: carbon.per_household_horizon
    label: Carbon per household
    question: Tonnes CO2e per household over the analysis horizon — building materials, energy, and travel.
    direction: lower_is_better
    group: climate
    default_weight: 1

  # Added 2026-09-26 (spec: docs/superpowers/specs/2026-09-26-tax-metrics-design.md).
  # Total property tax the parcel yields over the analysis horizon, net of any
  # reviewed abatement. It passes both tests at the top of this file: it varies by
  # housing type (homes x per-home assessed value, and the county comps give each
  # type its own value), and that value comes from observed comps rather than from
  # development cost, so it is not a restatement of `affordability`.
  # tests/test_tax.py enforces the second point on real lots.
  - id: public_revenue
    metric_id: revenue.public_horizon
    label: Public revenue
    question: How much property tax would this option return to the City, the school district and the county over the analysis horizon?
    direction: higher_is_better
    group: fiscal
    default_weight: 1

# Patterns worth naming out loud. The option best on `top_on` that is also worst
# on any of `bottom_on` gets this message in the tradeoff receipt and the memo.
# A rank on one criterion involves no weights, so this is evidence, computed by
# the engine, not a judgment about what should be built.
tension_flags:
  - id: revenue_vs_affordability
    label: High revenue, high exclusion
    top_on: public_revenue
    bottom_on: [affordability, local_affordability_gap]
    message: >-
      This option yields the most public revenue and is also the least affordable
      of the options compared. Both are true at once; which matters more is a
      values question, not an evidence one.
