id: pittsburgh
name: City of Pittsburgh
state_fips: "42"
county_fips: "003"
# 3D city view. Longitude/latitude map to scene units around `origin` using
# `scale` (units per degree); the scene is a square of side 2 × `half_extent`.
# Rivers are hand-traced centerlines for a stylized diorama, not survey data.
scene:
  origin: [-79.9959, 40.4406]
  scale: [5000, 6500]
  half_extent: 620
  # Terrain for the 3D city, baked by `uv run python -m pipeline.build_terrain`
  # into web/public/data/terrain.{json,bin}. Elevation in meters from the source
  # is turned into scene height: water where elevation < pool + water_margin_m,
  # otherwise h = (e − pool)/m_per_unit · vertical_exaggeration · (1 + (e − pool)/steepen_m) / damping.
  # A stylized view (heights exaggerated for legibility), not a survey.
  # Decorative river bridges for the stylized city. [name, lat, lon, form, length_m].
  # Coordinates as given in the 3D design handoff, which cites Wikipedia's
  # "List of bridges of Pittsburgh"; not independently verified and never used
  # in any metric. `form` picks a model in web/src/three/bridges.ts.
  bridges:
    - [Fort Pitt, 40.4388, -80.0111, tied_arch_double, 370]
    - [Smithfield Street, 40.4351, -80.002, lenticular, 360]
    - [Panhandle, 40.43306, -79.99806, truss, 300]
    - [Liberty, 40.4328, -79.9968, cantilever, 720]
    - [South Tenth Street, 40.4325, -79.98917, suspension, 390]
    - [Birmingham, 40.433361, -79.973499, tied_arch, 500]
    - [Hot Metal, 40.428268, -79.960776, truss, 358]
    - [Glenwood, 40.3976, -79.9355, cantilever, 690]
    - [Glenwood B&O, 40.3984, -79.9314, truss, 731]
    - [Fort Duquesne, 40.4443, -80.0093, tied_arch_double, 430]
    - [Roberto Clemente, 40.4456, -80.0033, suspension, 323]
    - [Andy Warhol, 40.44611, -80.00139, suspension, 323]
    - [Rachel Carson, 40.4467, -79.9998, suspension, 340]
    - [Fort Wayne Railroad, 40.4482, -79.9962, truss, 330]
    - [Veterans, 40.4499, -79.9934, girder, 600]
    - [David McCullough (16th St), 40.4517, -79.9909, twin_arch, 608]
    - [31st Street, 40.463, -79.9758, tied_arch, 817]
    - [33rd Street Railroad, 40.4657, -79.9736, truss, 500]
    - [40th Street, 40.4728, -79.9686, deck_arch, 720]
    - [62nd Street, 40.4912, -79.9381, truss, 750]
    - [Highland Park, 40.4891, -79.912, truss, 700]
    - [Brilliant Branch Railroad, 40.4866, -79.9053, truss, 450]
    - [West End, 40.44631, -80.02699, tied_arch, 400]
    - [McKees Rocks, 40.47722, -80.04833, tied_arch, 600]
    - [Ohio Connecting Railroad, 40.46278, -80.04306, truss, 600]
  terrain:
    source: aws_terrain_tiles
    inner: { zoom: 12, half_lon: 0.15, half_lat: 0.115 }
    outer: { zoom: 10, half_lon: 0.42, half_lat: 0.33 }
    river_pool_m: 217
    water_margin_m: 1.6
    m_per_unit: 17
    vertical_exaggeration: 4.5
    steepen_m: 170
    damping: 3
    coarse: { extent: 2000, step: 12.5 }
    fine: { margin: 60, step: 3.5 }
  rivers:
    - [[-80.0125, 40.442], [-79.99, 40.45], [-79.97, 40.462], [-79.945, 40.475], [-79.92, 40.482], [-79.88, 40.492]]
    - [[-80.0125, 40.442], [-79.99, 40.434], [-79.965, 40.425], [-79.95, 40.414], [-79.935, 40.4], [-79.915, 40.395], [-79.885, 40.405]]
    - [[-80.0125, 40.442], [-80.03, 40.452], [-80.05, 40.468], [-80.075, 40.48], [-80.1, 40.49]]
map:
  center: [-79.9959, 40.4406]
  zoom: 11.5
  basemap_style: https://tiles.openfreemap.org/styles/positron

# Parcels ---------------------------------------------------------------------
parcels:
  # The dataset that lot size and assessed land value come from. Two jobs: the
  # pipeline downloads from it, and the engine tags every number it produces
  # with where that number came from, reading the name from right here.
  assessments_source: wprdc_assessments
  centroids_source: wprdc_parcel_centroids
  centroids_filter: { MUNI_NAME: PITTSBURGH }
  centroid_fields:
    PIN: id
    LONG: lon
    LAT: lat
    FIPS_TRACT: tract
    FIPS_BLOCKGROUP: block_group
    CITY_NEIGHBORHOOD: neighborhood
  # Assessment rows inside city limits: MUNIDESC looks like "13th Ward - PITTSBURGH".
  # What a parcel id looks like here. Allegheny County PINs are capital letters
  # and digits only, within a set length. The API rejects any id in a URL that
  # doesn't match, before looking anything up - which also means a URL can never
  # contain a slash or dot and be used to reach a file on the server.
  id_pattern: "^[A-Z0-9]+$"
  id_min_chars: 4
  id_max_chars: 32
  municipality_field: MUNIDESC
  # Whitespace-tolerant: the county writes "1st Ward  - PITTSBURGH" with two
  # spaces and the other wards with one (checked 2026-09-26).
  municipality_pattern: "Ward\\s+-\\s+PITTSBURGH$"
  # The word to ask the datastore's full-text search for so it returns only
  # city rows of a large table server-side (pipeline/build_comps.py); the
  # pattern above is still applied to what comes back.
  municipality_search_term: PITTSBURGH
  # What counts as "vacant" (decision 2026-09-26: vacant land use classes only).
  vacant_use_field: USEDESC
  vacant_use_values:
    - VACANT LAND
    - VACANT COMMERCIAL LAND
    - VACANT INDUSTRIAL LAND
    - ">10 ACRES VACANT"
  # Lot frontage and depth, parsed from the deed legal description, which in
  # Allegheny County usually reads "LOT <frontage>X<depth>" in feet. The legal
  # text itself is read only to parse this and is never stored. Parsed dims are
  # accepted only when frontage x depth agrees with the assessed lot area within
  # `area_tolerance`; otherwise the lot shape falls back to the placeholder
  # `lot_depth_to_frontage_ratio` in assumptions.yaml.
  lot_shape:
    legal_field: LEGAL1
    dims_pattern: '(\d+(?:\.\d+)?)\s*X\s*(\d+(?:\.\d+)?)'
    area_tolerance: [0.6, 1.6]
  # Only these assessment fields are kept. Owner names and owner mailing
  # addresses (CHANGENOTICEADDRESS*) are never read into the pipeline.
  keep_fields:
    PARID: id
    PROPERTYHOUSENUM: house_number
    PROPERTYADDRESS: street
    PROPERTYZIP: zip
    USEDESC: land_use
    LOTAREA: lot_area_sf
    FAIRMARKETLAND: land_value_usd
    OWNERDESC: owner_type
    TAXDESC: tax_status

public_land:
  source: wprdc_city_owned
  id_field: pin
  keep_fields:
    inventory_type: public_inventory_type
    current_status: public_status

neighborhoods:
  source: wprdc_neighborhoods
  name_field: hood

zoning_layer:
  source: wprdc_zoning
  district_field: zon_new
  label_field: full_zoning_type
  code_link_field: municode

# `lot_scene: hill` draws a hillside behind the lot in the 3D view.
zoning_links: [pgh_zoning_code, pgh_zoning_map, pgh_zoning_page]
hazards:
  steep_slope: { source: wprdc_steep_slope, label: "Slope 25% or greater", lot_scene: hill }
  landslide: { source: wprdc_landslide_prone, label: "Landslide-prone area" }
  undermined: { source: wprdc_undermined, label: "Undermined area" }

# Observed context. These fields inform the site panel; sewershed and flood
# polygons do not feed the unmeasured sewer-stress or site-cost assumptions.
context:
  acs:
    source: acs_5yr
    income_url: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/acsdt5y2024-b19013.dat
    rent_burden_url: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/acsdt5y2024-b25070.dat
  parcel_boundaries:
    source: allegheny_parcel_boundaries
    service_url: https://gisdata.alleghenycounty.us/arcgis/rest/services/OPENDATA/Parcels/MapServer/0
  flood:
    source: fema_nfhl
    service_url: https://maps.pasda.psu.edu/ArcGIS/rest/services/pasda/FEMA_NationalFloodHazardLayer_PA/MapServer/0
  combined_sewersheds:
    source: pwsa_combined_sewersheds

# Suggested lots: spread across the city, not favorites.
suggested_lots:
  count: 12
  min_lot_area_sf: 2000
  # Pick at most one lot per neighborhood, and cycle through these strata so the
  # suggestions cover different conditions. A lot no housing type fits is never
  # suggested — it would open on an empty comparison — but it stays selectable
  # from the map like any other parcel.
  strata: [zoning_district, steep_slope, landslide, public]
