# Every number the engine uses. Each has value/low/high/unit/source/rationale and
# a provenance:
#   assumption  — a documented modeling choice or published rule of thumb
#   placeholder — NOT yet sourced; shown hatched in the UI and counted in
#                 docs/LIMITATIONS.md. Replace with a sourced value, then change
#                 provenance to "assumption" (or "observed") and set `source`.
# Optional `by_typology` overrides value/low/high per typology id; typologies
# not listed fall back to the top-level value.
assumptions:

  # --- Income -----------------------------------------------------------------
  ami_4person:
    label: Area median family income (4 people)
    value: 110400
    low: 110400
    high: 110400
    unit: USD/yr
    provenance: observed
    source: hud_income_limits
    rationale: >-
      HUD FY2026 median family income for the Pittsburgh, PA HMFA, area code
      METRO38300M38300. This is an area baseline, not a household observation.
      Published income limits use HUD adjustments and are not simple multiples.

  household_size_factor:
    label: HUD household-size adjustment
    # HUD income-limit adjustment relative to a 4-person household.
    value: 1.0
    low: 1.0
    high: 1.0
    unit: ratio
    provenance: assumption
    source: hud_income_limits
    rationale: HUD's published household-size adjustment (1p 70%, 2p 80%, 3p 90%, 4p 100%, +8% each above 4).
    by_size: { 1: 0.70, 2: 0.80, 3: 0.90, 4: 1.00, 5: 1.08, 6: 1.16, 7: 1.24, 8: 1.32 }

  housing_cost_share:
    label: Share of income for housing
    value: 0.30
    low: 0.30
    high: 0.30
    unit: share of income
    provenance: assumption
    source: hud_chas
    rationale: HUD's cost-burden threshold — housing costs above 30% of income.

  # --- Development cost -------------------------------------------------------
  hard_cost_psf:
    label: Construction cost per sq ft
    value: 200
    low: 156
    high: 250
    unit: USD/sf
    provenance: assumption
    source: hud_tdc_2024
    rationale: >-
      HUD 2024 Housing Construction Cost (HCC) limits for Pittsburgh, divided by
      the unit size HUD assumes for that bedroom count, using the building type
      closest to each typology (detached/semi-detached, row house, walkup,
      elevator). HCC covers hard costs incl. builder overhead and profit,
      utilities, landscaping and Davis-Bacon wages. It is a cap for
      publicly funded housing, so treat it as a benchmark, not a bid: low = 85%
      of the cap, high = 110% (2024→2026 cost escalation).
    by_typology:
      detached: { value: 200, low: 170, high: 220 }     # Detached 3 BR: 239,813 / 1,200 sf
      adu_pair: { value: 223, low: 190, high: 245 }     # Detached 2 BR: 200,590 / 900 sf
      two_unit: { value: 223, low: 190, high: 245 }     # Semi-detached 2 BR: 200,590 / 900 sf
      rowhouse: { value: 183, low: 156, high: 201 }     # Row house 3 BR: 219,650 / 1,200 sf
      small_multi: { value: 196, low: 167, high: 216 }  # Walkup 1 BR: 137,410 / 700 sf
      midrise: { value: 228, low: 194, high: 250 }      # Elevator 1 BR: 159,351 / 700 sf

  soft_cost_share:
    label: Soft costs (design, fees, financing)
    value: 0.25
    low: 0.15
    high: 0.40
    unit: share of hard cost
    provenance: assumption
    source: null
    rationale: >-
      Declared 15–40% planning allowance for design, permits, insurance, and
      project financing, centered at 25%. It is separate from site work, land,
      and contingency. HUD TDC is only a benchmark and is never subtracted
      from HCC to estimate this share. Replace with a project budget.

  hud_tdc_multiplier:
    label: HUD total development cost limit divided by HCC limit
    value: 1.75
    low: 1.60
    high: 1.75
    unit: TDC/HCC ratio
    provenance: observed
    source: hud_tdc_2024
    rationale: >-
      Published HUD 2024 Pittsburgh limits use TDC/HCC multipliers of 1.75 for
      non-elevator forms and 1.60 for elevator forms. This is retained only as
      a separate public-housing cap benchmark, never as a soft-cost share or
      project sources-and-uses line.
    by_typology:
      detached: { value: 1.75, low: 1.75, high: 1.75 }
      adu_pair: { value: 1.75, low: 1.75, high: 1.75 }
      two_unit: { value: 1.75, low: 1.75, high: 1.75 }
      rowhouse: { value: 1.75, low: 1.75, high: 1.75 }
      small_multi: { value: 1.75, low: 1.75, high: 1.75 }
      midrise: { value: 1.60, low: 1.60, high: 1.60 }

  steep_slope_cost_share:
    label: Slope budget reserve scenario
    value: 0.1
    low: 0
    high: 0.2
    unit: share of hard cost
    provenance: assumption
    source: lotline_risk_reserves
    rationale: >-
      Declared slope budget reserve: two 5% contingency-reference blocks, with zero to four blocks as a stress range. PHFA supplies only the 5% reference scale; Lotline selects the multipliers. Not an engineering estimate or proof that retaining/foundation work is required.

  landslide_cost_share:
    label: Landslide budget reserve scenario
    value: 0.15
    low: 0
    high: 0.3
    unit: share of hard cost
    provenance: assumption
    source: lotline_risk_reserves
    rationale: >-
      Declared landslide budget reserve: three 5% contingency-reference blocks, with zero to six blocks as a stress range. PHFA supplies only the 5% reference scale; Lotline selects the multipliers. Not a stabilization-cost estimate or evidence of a safe design.

  undermined_cost_share:
    label: Mine-risk budget reserve scenario
    value: 0.05
    low: 0
    high: 0.1
    unit: share of hard cost
    provenance: assumption
    source: lotline_risk_reserves
    rationale: >-
      Declared mine-risk budget reserve: one 5% contingency-reference block, with zero to two blocks as a stress range. PHFA supplies only the 5% reference scale; Lotline selects the multipliers. Not a grouting-cost estimate or evidence that a mine void is present.

  # --- Cost to occupants ------------------------------------------------------
  annual_capital_cost_share:
    label: Yearly capital cost rate
    value: 0.074269865
    low: 0.060143582
    high: 0.089398178
    unit: share of development cost per year
    provenance: assumption
    source: lotline_finance_scenario_defaults
    rationale: >-
      Fallback computed as 70% amortizing debt plus 30% equity return from the declared finance scenario. The full parcel financing model takes precedence; no lender commitment is implied.

  operating_cost_per_unit_month:
    label: Operating cost per home
    value: 1079.2333
    low: 761.75819
    high: 1580.0241
    unit: USD/unit/month
    provenance: assumption
    source: lotline_finance_scenario_defaults
    rationale: >-
      Fallback sums the configured insurance, utilities, maintenance, management and PHFA reserve budget, plus 2026 millage applied to prototype development cost. Assessed value, exemptions and land are not predicted; the full parcel finance model takes precedence.
    by_typology:
      detached: { value: 1474.5785, low: 1039.0133, high: 2118.6001 }
      adu_pair: { value: 1327.4472, low: 936.76882, high: 1916.4349 }
      two_unit: { value: 1363.2272, low: 961.99797, high: 1965.2334 }
      rowhouse: { value: 1339.4808, low: 945.53263, high: 1932.5683 }
      small_multi: { value: 1079.2333, low: 761.75819, high: 1580.0241 }
      midrise: { value: 1124.8007, low: 793.36102, high: 1638.5823 }

  # --- Carbon -----------------------------------------------------------------
  embodied_kgco2e_psf:
    label: A1–A3 structure materials per sq ft
    value: 7.43
    low: 1.81
    high: 22.48
    unit: kgCO2e/sf
    provenance: modeled
    source: jungclaus_2024_sf_embodied_a1a3
    rationale: >-
      Published gross single-family structure, enclosure and foundation benchmark; midpoint is a declared central proxy. Wider declared form ranges are used for non-native typologies. Excludes interiors, MEP, appliances, site works, A4–A5, replacements and end-of-life. No biogenic credit. This is a partial materials estimate, not whole-building carbon.
    by_typology:
      detached: { value: 7.43, low: 3.62, high: 11.24 }
      adu_pair: { value: 7.43, low: 2.72, high: 16.86 }
      two_unit: { value: 7.43, low: 2.72, high: 16.86 }
      rowhouse: { value: 7.43, low: 2.72, high: 16.86 }
      small_multi: { value: 7.43, low: 1.81, high: 22.48 }
      midrise: { value: 7.43, low: 1.81, high: 22.48 }

  operational_kwh_psf_yr:
    label: Prototype home electricity per sq ft
    value: 8.95
    low: 8.12
    high: 9.3
    unit: kWh/sf/yr
    provenance: modeled
    source: doe_iecc2021_residential_cz5a_outputs
    rationale: >-
      DOE 2021 IECC climate-zone-5A all-electric heat-pump prototype facility electricity divided by conditioned floor area. Foundation outputs supply the native range; non-native forms have declared sensitivity factors. Buffalo representative weather is a Pittsburgh climate-zone proxy, not a parcel energy audit.
    by_typology:
      detached: { value: 8.07, low: 7.1, high: 8.48 }
      adu_pair: { value: 8.07, low: 5.33, high: 12.72 }
      two_unit: { value: 8.07, low: 5.33, high: 12.72 }
      rowhouse: { value: 8.07, low: 5.33, high: 12.72 }
      small_multi: { value: 8.95, low: 8.12, high: 9.3 }
      midrise: { value: 8.95, low: 6.09, high: 13.95 }

  grid_kgco2e_per_kwh:
    label: Historical grid output intensity
    value: 0.416
    low: 0.416
    high: 0.416
    unit: kgCO2e/kWh
    provenance: assumption
    source: epa_egrid
    rationale: >-
      Historical eGRID2023 revision 2 RFCW output-rate reference: 916.1 lb/MWh,
      rounded to 0.416 kgCO2e/kWh. Statewide Pennsylvania output is a different
      geography, and transmission losses are not added to this output-rate
      boundary. Runtime uses the named Cambium annual end-use trajectory; this
      reference is a scalar fallback.

  grid_decarbonization_per_yr:
    label: Grid scenario endpoint decline
    value: 0.029003789
    low: 0.018855829
    high: 0.038458125
    unit: share/year
    provenance: modeled
    source: nrel_cambium_2024
    rationale: >-
      Compound annual decline from Cambium 2024 Mid-case 2025/2050 endpoints; range spans eight model scenarios. This is a descriptive summary only. The application calculates from the annual interpolated grid trajectory, with the 2050 endpoint held after 2050 and disclosed.

  vmt_per_household_yr:
    label: Modeled household vehicle miles
    value: 11579.95
    low: 11326.79
    high: 11863.02
    unit: miles/household/yr
    provenance: modeled
    source: bts_latch_2017
    rationale: >-
      Allegheny County household-weighted BTS LATCH 2017 modeled weekday household VMT annualized using the national NHTS 2017 weekend/weekday driver ratio. Runtime uses exact 2010 tract-code proxies when available, otherwise this county fallback. Range covers ratio sensitivity only, not model confidence or household variation.

  kgco2e_per_vmt:
    label: Carbon per mile driven
    value: 0.393
    low: 0.393
    high: 0.393
    unit: kgCO2e/mile
    provenance: assumption
    source: epa_ghg_factors
    rationale: >-
      EPA's greenhouse-gas equivalencies calculation uses 0.393 kg CO2e per
      vehicle-mile for an average U.S. gasoline passenger vehicle (2022 fleet
      and fuel-economy baseline). National tailpipe proxy, not Pittsburgh
      observed emissions or a vehicle-specific estimate. Future fleet changes
      and upstream fuel/vehicle emissions are omitted.

  lot_depth_to_frontage_ratio:
    label: Lot depth-to-width ratio
    value: 3.63636364
    low: 0.755028664
    high: 5.6189748
    unit: depth / frontage
    provenance: modeled
    source: lotline_context_estimates
    rationale: >-
      Median depth/frontage ratio among matched legal-description dimensions in the vacant-parcel cohort; donor variation is a drawing and form-fit scenario, not legal frontage.

  site_area_per_building_footprint:
    label: Lot area needed per footprint
    value: 1.2
    low: 1.0
    high: 1.6
    unit: lot sf / building footprint sf
    provenance: assumption
    source: null
    rationale: >-
      Screening floor on how much lot a building form needs, as a multiple of its
      own footprint. Deliberately permissive: what actually limits how much of a
      Pittsburgh lot may be covered is the zoning code's lot-coverage and setback
      rules. Setbacks are evaluated separately in core/zoning.py against the rules
      in force (not necessarily rules a person has reviewed); lot coverage is not
      extracted from the code at all yet, so no lot-coverage limit is applied
      anywhere. This check exists only to stop a form being offered on a lot that
      plainly cannot hold it, so it is set just above bare footprint rather than
      at a coverage ratio that would silently duplicate — and pre-empt — the
      zoning layer. Each typology's floor is derived from this and its own
      footprint; nothing is written per typology.

  analysis_years:
    label: Carbon horizon
    value: 30
    low: 30
    high: 30
    unit: years
    provenance: assumption
    source: null
    rationale: Horizon for cumulative carbon and crossover years.

  # --- Context fallbacks (used only where a parcel/tract join is unavailable) -
  tract_median_household_income:
    label: Nearby household income (local donor estimate)
    value: 65247
    low: 32114.5
    high: 103869
    unit: USD/yr
    provenance: modeled
    source: lotline_context_estimates
    rationale: >-
      Median of distinct matched Pittsburgh tract medians; donor 10th–90th percentiles are a geographic scenario range, not a citywide household median or confidence interval.

  tract_renter_cost_burden_share:
    label: Renters cost-burdened (local donor estimate)
    value: 0.46635
    low: 0.28038
    high: 0.72981
    unit: share of renter households
    provenance: modeled
    source: lotline_context_estimates
    rationale: >-
      Median of distinct matched Pittsburgh tract renter-burden shares; donor 10th–90th percentiles describe spatial variability, not the unmatched tract's confidence interval.

  jobs_access_index:
    label: Transit access to jobs
    value: 0.516604787
    low: 0.301871812
    high: 0.697803928
    unit: index (regional max = 1)
    provenance: modeled
    source: lotline_context_estimates
    rationale: >-
      Median of distinct matched local block-group EPA SLD D5DRI scores; donor range is a geographic proxy for unmatched parcels, not current route-level access.

  sewer_stress_index:
    label: Historical modeled overflow pressure
    value: 1
    low: 0
    high: 29.63950095
    unit: ratio to equal-weight mean modeled CSO outfall volume
    provenance: modeled
    source: alcosan_cwp_section4_2018
    rationale: >-
      Historical ALCOSAN 2018 Clean Water Plan existing-condition typical-year modeled annual outfall overflow, divided by the equal-weight mean across 339 modeled outfalls. Exact PWSA labels are resolved at runtime. Unmatched parcels use the regional mean and descriptive outfall range. This is outfall context, not parcel discharge, available capacity or a current observation.

  zoning_status_score:
    label: Score per zoning path
    value: 1.0
    low: 1.0
    high: 1.0
    unit: score 0–1
    provenance: assumption
    source: null
    rationale: >-
      How approval paths map onto the 0–1 feasibility score. A modeling choice,
      shown in METHODS.md so it can be argued with.
    by_key:
      by_right: 1.0
      # An Administrator Exception is decided by City staff with no public
      # hearing and no board or council vote, so it sits much closer to
      # by-right than to a Zoning Board case — a real step with real risk,
      # but not a hearing to prepare for.
      administrator_exception: 0.85
      special_exception: 0.6
      conditional_use: 0.45
      variance_needed: 0.3
      needs_review: 0.5
      not_permitted: 0.1

  infrastructure_hazard_weight:
    label: Extra load per site hazard
    value: 1.0
    low: 1.0
    high: 1.0
    unit: added load multiplier per flag
    provenance: assumption
    source: null
    rationale: >-
      How much each site flag multiplies infrastructure load (1 + sum of weights of
      flags present). A modeling choice to make site strain visible, not an engineering estimate.
    by_key:
      steep_slope: 0.5
      landslide: 0.5
      undermined: 0.25
