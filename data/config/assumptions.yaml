# Every number the engine uses. Each has value/low/high/unit/source/rationale and
# a provenance:
#   assumption  — a documented modeling choice or published rule of thumb
#   placeholder — NOT yet sourced; shown hatched in the UI and counted in
#                 docs/LIMITATIONS.md. Replace with a sourced value, then change
#                 provenance to "assumption" (or "observed") and set `source`.
# Optional `by_typology` overrides value/low/high per typology id; typologies
# not listed fall back to the top-level value.
assumptions:

  # --- Income -----------------------------------------------------------------
  ami_4person:
    label: Area median family income (4 people)
    value: 110400
    low: 110400
    high: 110400
    unit: USD/yr
    provenance: observed
    source: hud_income_limits
    rationale: >-
      HUD FY2026 median family income for the Pittsburgh, PA HMFA, area code
      METRO38300M38300. This is an area baseline, not a household observation.
      Published income limits use HUD adjustments and are not simple multiples.

  household_size_factor:
    label: HUD household-size adjustment
    # HUD income-limit adjustment relative to a 4-person household.
    value: 1.0
    low: 1.0
    high: 1.0
    unit: ratio
    provenance: assumption
    source: hud_income_limits
    rationale: HUD's published household-size adjustment (1p 70%, 2p 80%, 3p 90%, 4p 100%, +8% each above 4).
    by_size: { 1: 0.70, 2: 0.80, 3: 0.90, 4: 1.00, 5: 1.08, 6: 1.16, 7: 1.24, 8: 1.32 }

  housing_cost_share:
    label: Share of income for housing
    value: 0.30
    low: 0.30
    high: 0.30
    unit: share of income
    provenance: assumption
    source: hud_chas
    rationale: HUD's cost-burden threshold — housing costs above 30% of income.

  # --- Development cost -------------------------------------------------------
  hard_cost_psf:
    label: Construction cost per sq ft
    value: 200
    low: 156
    high: 250
    unit: USD/sf
    provenance: assumption
    source: hud_tdc_2024
    rationale: >-
      HUD 2024 Housing Construction Cost (HCC) limits for Pittsburgh, divided by
      the unit size HUD assumes for that bedroom count, using the building type
      closest to each typology (detached/semi-detached, row house, walkup,
      elevator). HCC covers hard costs incl. builder overhead and profit,
      utilities, landscaping and Davis-Bacon wages. It is a cap for
      publicly funded housing, so treat it as a benchmark, not a bid: low = 85%
      of the cap, high = 110% (2024→2026 cost escalation).
    by_typology:
      detached: { value: 200, low: 170, high: 220 }     # Detached 3 BR: 239,813 / 1,200 sf
      adu_pair: { value: 223, low: 190, high: 245 }     # Detached 2 BR: 200,590 / 900 sf
      two_unit: { value: 223, low: 190, high: 245 }     # Semi-detached 2 BR: 200,590 / 900 sf
      rowhouse: { value: 183, low: 156, high: 201 }     # Row house 3 BR: 219,650 / 1,200 sf
      small_multi: { value: 196, low: 167, high: 216 }  # Walkup 1 BR: 137,410 / 700 sf
      midrise: { value: 228, low: 194, high: 250 }      # Elevator 1 BR: 159,351 / 700 sf

  soft_cost_share:
    label: Soft costs (design, fees, financing)
    value: 0.25
    low: 0.15
    high: 0.40
    unit: share of hard cost
    provenance: assumption
    source: null
    rationale: >-
      Declared 15–40% planning allowance for design, permits, insurance, and
      project financing, centered at 25%. It is separate from site work, land,
      and contingency. HUD TDC is only a benchmark and is never subtracted
      from HCC to estimate this share. Replace with a project budget.

  hud_tdc_multiplier:
    label: HUD total development cost limit divided by HCC limit
    value: 1.75
    low: 1.60
    high: 1.75
    unit: TDC/HCC ratio
    provenance: observed
    source: hud_tdc_2024
    rationale: >-
      Published HUD 2024 Pittsburgh limits use TDC/HCC multipliers of 1.75 for
      non-elevator forms and 1.60 for elevator forms. This is retained only as
      a separate public-housing cap benchmark, never as a soft-cost share or
      project sources-and-uses line.
    by_typology:
      detached: { value: 1.75, low: 1.75, high: 1.75 }
      adu_pair: { value: 1.75, low: 1.75, high: 1.75 }
      two_unit: { value: 1.75, low: 1.75, high: 1.75 }
      rowhouse: { value: 1.75, low: 1.75, high: 1.75 }
      small_multi: { value: 1.75, low: 1.75, high: 1.75 }
      midrise: { value: 1.60, low: 1.60, high: 1.60 }

  steep_slope_cost_share:
    label: Steep-slope site allowance
    value: 0.12
    low: 0.05
    high: 0.30
    unit: share of hard cost
    provenance: placeholder
    source: null
    rationale: Extra foundation, retaining and grading cost on 25%+ slopes. Site-specific; needs geotechnical input.

  landslide_cost_share:
    label: Landslide stabilization allowance
    value: 0.10
    low: 0.03
    high: 0.35
    unit: share of hard cost
    provenance: placeholder
    source: null
    rationale: Added stabilization cost in landslide-prone areas. Highly site-specific.

  undermined_cost_share:
    label: Mine-subsidence allowance
    value: 0.05
    low: 0.0
    high: 0.20
    unit: share of hard cost
    provenance: placeholder
    source: null
    rationale: Mine-subsidence investigation / mitigation allowance.

  # --- Cost to occupants ------------------------------------------------------
  annual_capital_cost_share:
    label: Yearly capital cost rate
    value: 0.075
    low: 0.06
    high: 0.09
    unit: share of development cost per year
    provenance: placeholder
    source: null
    rationale: Debt service plus required return, expressed per year. Drives the rent needed to cover cost.

  operating_cost_per_unit_month:
    label: Operating cost per home
    value: 450
    low: 350
    high: 600
    unit: USD/unit/month
    provenance: placeholder
    source: null
    rationale: Taxes, insurance, maintenance, management, reserves.

  # --- Carbon -----------------------------------------------------------------
  embodied_kgco2e_psf:
    label: Embodied carbon per sq ft
    value: 45
    low: 30
    high: 65
    unit: kgCO2e/sf
    provenance: placeholder
    source: null
    rationale: Upfront (A1–A5) embodied carbon of new residential construction.
    by_typology:
      detached: { value: 40, low: 28, high: 58 }
      adu_pair: { value: 40, low: 28, high: 58 }
      two_unit: { value: 40, low: 28, high: 58 }
      rowhouse: { value: 38, low: 27, high: 55 }
      small_multi: { value: 45, low: 32, high: 65 }
      midrise: { value: 55, low: 40, high: 80 }

  operational_kwh_psf_yr:
    label: Home energy use per sq ft
    value: 9
    low: 6
    high: 13
    unit: kWh/sf/yr
    provenance: placeholder
    source: nrel_resstock
    rationale: All-electric new construction site energy. Attached forms share walls and use less per sf.
    by_typology:
      detached: { value: 10.5, low: 7.5, high: 14 }
      adu_pair: { value: 10, low: 7, high: 13.5 }
      two_unit: { value: 9, low: 6.5, high: 12.5 }
      rowhouse: { value: 8.5, low: 6, high: 12 }
      small_multi: { value: 7.5, low: 5.5, high: 10.5 }
      midrise: { value: 7, low: 5, high: 10 }

  grid_kgco2e_per_kwh:
    label: Grid carbon intensity
    value: 0.416
    low: 0.294
    high: 0.434
    unit: kgCO2e/kWh
    provenance: assumption
    source: epa_egrid
    rationale: >-
      eGRID2023 (rev 2) total output CO2e rate for the RFC West subregion, which
      serves western Pennsylvania: 916.1 lb/MWh = 0.416 kg/kWh. High adds RFCW's
      4.2% grid gross loss (0.434). Low is the Pennsylvania statewide rate,
      647.9 lb/MWh (0.294), for a household on a cleaner PA mix.

  grid_decarbonization_per_yr:
    label: Yearly grid decarbonization
    value: 0.02
    low: 0.0
    high: 0.04
    unit: share per year
    provenance: placeholder
    source: null
    rationale: Annual decline in grid carbon intensity over the analysis period.

  vmt_per_household_yr:
    label: Miles driven per household
    value: 12000
    low: 8000
    high: 16000
    unit: miles/yr
    provenance: placeholder
    source: null
    rationale: >-
      No defensible household VMT observation is connected. EPA Smart Location
      transit accessibility is not VMT; this stand-in is not scaled by transit
      access and should be removed from ranking claims until a matching regional
      travel model is integrated.

  kgco2e_per_vmt:
    label: Carbon per mile driven
    value: 0.393
    low: 0.393
    high: 0.393
    unit: kgCO2e/mile
    provenance: assumption
    source: epa_ghg_factors
    rationale: >-
      EPA's greenhouse-gas equivalencies calculation uses 0.393 kg CO2e per
      vehicle-mile for an average U.S. passenger vehicle (2022 fleet and fuel
      economy baseline). This is a national tailpipe proxy, not Pittsburgh
      household VMT or a vehicle-specific estimate.

  lot_depth_to_frontage_ratio:
    label: Lot depth-to-width ratio
    value: 3.0
    low: 2.0
    high: 4.5
    unit: depth / frontage
    provenance: placeholder
    source: null
    rationale: >-
      Only used to draw a lot whose legal description gives no usable dimensions
      and whose parcel polygon is unavailable or unusable. When a PIN-matched
      county polygon is available, the pipeline derives approximate axes from
      its minimum rotated rectangle instead. This fallback remains a placeholder;
      geometry-derived axes are modeled estimates, not legal frontage.

  site_area_per_building_footprint:
    label: Lot area needed per footprint
    value: 1.2
    low: 1.0
    high: 1.6
    unit: lot sf / building footprint sf
    provenance: assumption
    source: null
    rationale: >-
      Screening floor on how much lot a building form needs, as a multiple of its
      own footprint. Deliberately permissive: what actually limits how much of a
      Pittsburgh lot may be covered is the zoning code's lot-coverage and setback
      rules, which are evaluated separately in core/zoning.py against reviewed
      rules. This check exists only to stop a form being offered on a lot that
      plainly cannot hold it, so it is set just above bare footprint rather than
      at a coverage ratio that would silently duplicate — and pre-empt — the
      zoning layer. Each typology's floor is derived from this and its own
      footprint; nothing is written per typology.

  analysis_years:
    label: Carbon horizon
    value: 30
    low: 30
    high: 30
    unit: years
    provenance: assumption
    source: null
    rationale: Horizon for cumulative carbon and crossover years.

  # --- Context fallbacks (used only where a parcel/tract join is unavailable) -
  tract_median_household_income:
    label: Nearby household income (stand-in)
    value: 60000
    low: 40000
    high: 85000
    unit: USD/yr
    provenance: placeholder
    source: acs_5yr
    rationale: >-
      Fallback only when the 2024 ACS B19013 tract estimate is missing or
      suppressed. The parcel pipeline joins the tract value and published MOE
      for available records; this citywide stand-in is not an observed tract value.

  tract_renter_cost_burden_share:
    label: Renters cost-burdened (stand-in)
    value: 0.45
    low: 0.35
    high: 0.55
    unit: share of renter households
    provenance: placeholder
    source: acs_5yr
    rationale: >-
      Fallback only when the 2024 ACS B25070 tract estimate is unavailable. The
      parcel pipeline computes renter gross-rent cost burden by tract and keeps
      the numerator/denominator and an approximate uncertainty envelope.

  jobs_access_index:
    label: Transit access to jobs
    value: 1.0
    low: 0.6
    high: 1.4
    unit: index (regional max = 1)
    provenance: placeholder
    source: epa_smart_location
    rationale: >-
      Fallback only where EPA Smart Location Database D5DRI is unavailable for
      the parcel's block group. D5DRI is a 0–1 relative transit-job-access score
      normalized to the highest block group in the Pittsburgh CBSA; it is not a
      city-average ratio.

  sewer_stress_index:
    label: Combined-sewer stress
    value: 1.0
    low: 0.8
    high: 1.2
    unit: index (city average = 1)
    provenance: placeholder
    source: alcosan_cso
    rationale: Combined-sewer overflow pressure at the lot's sewershed. Stand-in until ALCOSAN/PWSA data is joined.

  # --- Scoring conventions ----------------------------------------------------
  zoning_status_score:
    label: Score per zoning path
    value: 1.0
    low: 1.0
    high: 1.0
    unit: score 0–1
    provenance: assumption
    source: null
    rationale: >-
      How approval paths map onto the 0–1 feasibility score. A modeling choice,
      shown in METHODS.md so it can be argued with.
    by_key:
      by_right: 1.0
      # An Administrator Exception is decided by City staff with no public
      # hearing and no board or council vote, so it sits much closer to
      # by-right than to a Zoning Board case — a real step with real risk,
      # but not a hearing to prepare for.
      administrator_exception: 0.85
      special_exception: 0.6
      conditional_use: 0.45
      variance_needed: 0.3
      needs_review: 0.5
      not_permitted: 0.1

  infrastructure_hazard_weight:
    label: Extra load per site hazard
    value: 1.0
    low: 1.0
    high: 1.0
    unit: added load multiplier per flag
    provenance: assumption
    source: null
    rationale: >-
      How much each site flag multiplies infrastructure load (1 + sum of weights of
      flags present). A modeling choice to make site strain visible, not an engineering estimate.
    by_key:
      steep_slope: 0.5
      landslide: 0.5
      undermined: 0.25
