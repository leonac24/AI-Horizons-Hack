  pittsburgh_transfer_tax_county:
    name: Allegheny County Realty Transfer Tax
    publisher: Allegheny County
    url: https://www.alleghenycounty.us/Services/Property-Assessments-and-Real-Estate/Realty-Transfer-Taxes
    access: manual
    vintage: live guidance; checked 2026-09-27
    license: public information
    verified: "2026-09-27"
    note: States Pittsburgh total is 5 percent; conflicts with the City's listed component total, so requires source review before a definitive transaction-cost result.

  freddie_mac_pmms:
    name: Freddie Mac Primary Mortgage Market Survey Archives
    publisher: Freddie Mac
