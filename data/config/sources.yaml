  allegheny_property_sales:
    name: Allegheny County Property Sale Transactions
    publisher: Allegheny County Department of Real Estate via WPRDC
    url: https://data.wprdc.org/dataset/real-estate-sales
    access: ckan_datastore
    resource_id: 5bbe6c55-bce6-4edb-9d04-68edeb6bf7b1
    vintage: current extract (fetched at pipeline run)
    license: Creative Commons CCZero
    verified: "2026-09-27"
    note: Retain only valid sale-code single-parcel deeds. Assessment cohort status is current and does not prove vacant status on the historic sale date.

  allegheny_address_points:
    name: Allegheny County Address Points
    publisher: Allegheny County GIS
