    vintage: live county addressing layer (cached at pipeline run)
    license: see Allegheny County GIS terms
    verified: "2026-09-27"
    note: PIN-matched PARCELID fallback coordinates; approximate address-point location, not parcel centroid or zoning/hazard determination.

  pa_dep_domestic_wastewater_manual:
    name: Domestic Wastewater Facilities Manual
    publisher: Pennsylvania Department of Environmental Protection
    url: https://greenport.pa.gov/elibrary/PDFProvider.ashx?PromptToSave=False&Size=789525&ViewerMode=2&action=PDFStream&docID=9232038&docName=DOMESTIC+WASTEWATER+FACILITIES+MANUAL&nativeExt=pdf&overlay=0&revision=0
    access: manual
    vintage: revision and cover date require verification at use
    license: public agency manual
    verified: "2026-09-27"
    note: Section 24.1, page 22, is the planned reference for domestic wastewater system design flow (at least 100 gpd/person unless rigorously justified, including normal infiltration); confirm current manual revision and project applicability before use.

  phfa_operating_budget_2025:
