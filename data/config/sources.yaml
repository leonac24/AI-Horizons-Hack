    license: Creative Commons CCZero
    verified: "2026-09-26"
    note: Drawn in the 3D city for orientation only (styled by domi_class); never used in any metric.

  pwsa_combined_sewersheds:
    name: PWSA Combined Sewersheds
    publisher: Pittsburgh Water and Sewer Authority via WPRDC
    url: https://data.wprdc.org/dataset/combined-sewershed
    access: ckan_download
    resource_id: 138d6b65-1630-4905-9421-de90cd9d59e5
    vintage: July 2018 resource
    license: Creative Commons Attribution
    verified: "2026-09-26"
    note: CSO_SHED identifies the mapped combined sewershed; outside the layer is not proof of a separate sewer or available capacity.

  prt_gtfs:
    name: Pittsburgh Regional Transit GTFS
    publisher: Pittsburgh Regional Transit via WPRDC
    url: https://data.wprdc.org/dataset/port-authority-of-allegheny-county-transit-data
    access: manual
    vintage: not yet retrieved
    license: see WPRDC dataset page
    verified: false

  umn_aaa_transit:
    name: Access Across America Transit 2024
    publisher: University of Minnesota Accessibility Observatory
    url: https://access.umn.edu/ao-research/aaa/transit/2024
    access: manual
    vintage: 2024 travel-time analysis; report published 2025
    license: verify dataset reuse terms
    verified: false
