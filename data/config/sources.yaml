  phfa_core_application_2025:
    name: PHFA Core Application
    publisher: Pennsylvania Housing Finance Agency
    url: https://www.phfa.org/forms/multifamily_application_guidelines/submission/tab_02/tab_02_02.pdf
    access: manual
    vintage: 2025 and 2026 multifamily application guidance
    license: public guidance
    verified: "2026-09-27"
