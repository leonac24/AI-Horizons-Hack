  fema_nfhl:
    name: FEMA National Flood Hazard Layer, Pennsylvania
    publisher: FEMA via Pennsylvania Spatial Data Access
    url: https://pasda.psu.edu/uci/DataSummary.aspx?dataset=2365
    access: arcgis
    vintage: July 2026 Pennsylvania extract
    license: public domain
    verified: "2026-09-26"
    note: A point inside each available parcel polygon is tested against the mapped flood zones. Partial-lot hazards can be missed; verify the map panel for a site decision.

  alcosan_cwp_section4_2018:
    name: ALCOSAN Clean Water Plan Section 4 modeled overflow tables
    publisher: ALCOSAN
    url: https://www.alcosan.org/docs/default-source/clean-water-plan-documents/cwp-section-4.pdf?sfvrsn=6d0d892a_2
    access: manual
    vintage: 2018 report; existing-condition typical year based on refined 2003 rainfall statistics
    license: public agency report
    verified: "2026-09-27"
    note: 349 outfall rows extracted; 339 have numerical typical-year model results. Exact outfall identifier joins and disclosed regional fallback provide historical context, not current measured overflow, parcel contribution or utility capacity.

  epa_egrid:
    name: EPA eGRID2023 summary tables (rev 2)
    publisher: U.S. EPA
    url: https://www.epa.gov/system/files/documents/2025-06/summary_tables_rev2.pdf
    access: manual
    vintage: eGRID2023 (2023 data, published 2025)
    license: public domain
    verified: "2026-09-26"
    note: Table 1 (subregion output emission rates, RFCW) and Table 3 (state rates, PA).

  hud_tdc_2024:
    name: HUD 2024 Unit Total Development Cost (TDC) and Housing Construction Cost (HCC) limits
    publisher: U.S. Department of Housing and Urban Development, Office of Public and Indian Housing
    url: https://www.hud.gov/sites/dfiles/PIH/documents/2024_Units_TDC_Limits.pdf
    access: manual
    vintage: "2024"
    license: public domain
    verified: "2026-09-26"
    note: Region III, Pennsylvania, Pittsburgh rows. Limits (caps) for public housing development, used as a cost benchmark.

  epa_smart_location:
    name: EPA Smart Location Database
    publisher: U.S. EPA
    url: https://services1.arcgis.com/IqEe3YDHhqT8n4KU/ArcGIS/rest/services/EPA_SmartLocationDatabase_V3_Jan_2021_Final/FeatureServer/0
    access: arcgis
    vintage: 2021 SLD 3.0; 2020 GTFS and travel times; 2017 LEHD; GEOID20 block groups
    license: public domain
    verified: "2026-09-27"
    note: D5DRI is transit job accessibility relative to the highest block group in the CBSA (0–1); D5BR is distance-decay-weighted jobs reachable within 45 minutes by transit. It is a site context measure, not household VMT.

  epa_ghg_factors:
    name: EPA Greenhouse Gas Emission Factors Hub and Equivalencies Calculator
    publisher: U.S. EPA
    url: https://www.epa.gov/energy/greenhouse-gas-equivalencies-calculator-calculations-and-references
    access: manual
    vintage: 2022 average passenger-vehicle fleet baseline (published in EPA's current references)
    license: public domain
    verified: "2026-09-27"
    note: 0.393 kg CO2e per vehicle-mile is an average U.S. passenger-vehicle tailpipe proxy; it does not specify Pittsburgh household VMT.

  nrel_resstock:
    name: ResStock
    publisher: U.S. DOE / NREL
    url: https://resstock.nrel.gov/
    access: manual
    vintage: not yet retrieved
    license: public
    verified: false

  aws_terrain_tiles:
    name: Terrain Tiles (Terrarium PNG)
    publisher: Mapzen / Amazon Web Services Open Data (derived from USGS 3DEP, SRTM and others)
    url: https://registry.opendata.aws/terrain-tiles/
    access: manual
    vintage: tiles last modified 2017
    license: see registry page; attribution to the underlying sources required
    verified: "2026-09-26"
    note: Used only to shape the stylized 3D city. Baked into web/public/data/terrain.bin by pipeline/build_terrain.py; never used in any metric.

  lotline_context_estimates:
    name: Lotline local donor context estimates
    publisher: Lotline using ACS, EPA SLD and county legal-description dimensions
    url: https://www.census.gov/programs-surveys/acs/data.html
    access: manual
    vintage: 2024 ACS; 2021 SLD; cached county assessment cohort
    license: derived from public agency data
    verified: "2026-09-27"
    note: Reproduced by pipeline.context_fallbacks. Distinct matched tract/block-group medians and donor 10th–90th percentiles replace unmatched context; these are disclosed geographic proxies, not target-geography observations.

  lotline_risk_reserves:
    name: Lotline declared site-risk reserve model
    publisher: Lotline; contingency reference from PHFA
    url: https://www.phfa.org/forms/multifamily_news/news/2025/2025-preapplication-meeting-qa.pdf
    access: manual
    vintage: 2025 PHFA reference; 2026 Lotline reserve scenario
    license: public agency guidance plus declared model assumptions
    verified: "2026-09-27"
    note: PHFA references a 5% construction contingency. Lotline selects additional reserve blocks for slope, landslide and mine flags; the multipliers are budget stress scenarios, not PHFA requirements or estimates of remediation cost.

  doe_iecc2021_residential_cz5a_outputs:
    name: Residential Prototype Building Models 2021 IECC - Climate Zone 5A
    publisher: U.S. Department of Energy, Building Energy Codes Program; models developed
      by PNNL
    url: https://www.energycodes.gov/prototype-building-models
    access: manual
    vintage: 2021 IECC; output tables generated 2024-06-27; DOE download page lists
      the dataset as published 2024-12-22
    license: see publisher data and reuse terms
    verified: '2026-09-27'
    note: EnergyPlus prototypes are modeled reference buildings, not measured homes.
      Heat-pump all-electric scenario is an explicit scenario choice, not a claim that
      all local construction is all-electric. Buffalo weather, schedules, size, equipment,
      end uses and DOE model assumptions differ from Pittsburgh buildings. Foundation
      min/max is scenario sensitivity, not a statistical confidence interval.
  pnnl_33270_allegheny_5a:
    name: 'Guide to Determining Climate Zone by County: Building America and IECC 2021
      Updates'
    publisher: Pacific Northwest National Laboratory
    url: https://www.pnnl.gov/main/publications/external/technical_reports/PNNL-33270.pdf
    access: manual
    vintage: 2022; PNNL-33270
    license: see publisher data and reuse terms
    verified: '2026-09-27'
    note: The county climate-zone designation does not make Buffalo TMY3 local Pittsburgh
      weather data.
  doe_pa_residential_code_status_2026:
    name: Pennsylvania State Energy Code Status
    publisher: U.S. Department of Energy, Building Energy Codes Program
    url: https://www.energycodes.gov/status/states/pennsylvania
    access: manual
    vintage: '2026-09-27'
    license: see publisher data and reuse terms
    verified: '2026-09-27'
    note: Local/state amendments apply; this prototype output is not a compliance determination.
  jungclaus_2024_sf_embodied_a1a3:
    name: Embodied carbon benchmarks of single-family residential buildings in the United
      States
    publisher: Matt A. Jungclaus, Nicholas Grant, Martín Torres, Jay H. Arehart, Wil
      V. Srubar III
    url: https://doi.org/10.1016/j.scs.2024.105975
    access: manual
    vintage: 2024 study
    license: see publisher data and reuse terms
    verified: '2026-09-27'
    note: The source benchmark covers detached single-family models only. Stated physical
      scope is structure, enclosure and foundation material classes; it does not establish
      that interior fit-out, MEP, appliances or site work are included. A1-A3 excludes
      installation-stage transport and construction (A4-A5), use/replacement and end-of-life
      stages. Multifamily/ADU/duplex/rowhouse values below are explicit typology proxies;
      wider proxy factors are scenario assumptions, not paper-reported intervals. Source
      range spans climate/foundation/modeling choices and is not a confidence interval.
  srubar_2023_sf_embodied_dataset:
    name: Material Use Intensity and Embodied Carbon Intensity of Single-Family Residential
      Buildings in the United States
    publisher: Figshare dataset
    url: https://doi.org/10.6084/m9.figshare.24451948.v1
    access: manual
    vintage: 2023 version 1
    license: see publisher data and reuse terms
    verified: '2026-09-27'
    note: Linked study data repository, provided for reproducibility; this implementation
      uses the published paper range rather than downloading individual rows.
  bts_latch_2017:
    name: 2017 Local Area Transportation Characteristics by Household (LATCH) tract
      CSV
    publisher: Bureau of Transportation Statistics, U.S. Department of Transportation
    url: https://www.bts.gov/latch/latch-data
    access: manual
    vintage: 2017 modeled estimates using 2017 NHTS travel + 2012–2016 ACS covariates
    license: public agency data; see source terms
    verified: '2026-09-27'
    note: LATCH is a model transferred from NHTS/ACS characteristics, not observed travel
      at a parcel or current household. Current parcel tract codes use 2024 ACS geography;
      matching an 11-digit value to a 2010 LATCH code does not verify matching tract
      boundaries. LATCH weekday values omit weekend travel and were not designed as
      annual household mileage. The national/county weighted estimates omit tract records
      without valid estimate/positive hh count. LATCH flag_acs_lt_moe is preserved;
      it indicates ACS margin-of-error issue for one or more explanatory estimates,
      not an uncertainty interval for LATCH travel.
  epa_egrid_2023_reference:
    name: eGRID2023, Revision 2 summary data
    publisher: U.S. Environmental Protection Agency
    url: https://www.epa.gov/egrid/summary-data
    access: manual
    vintage: 2023 generation/emissions, Revision 2 released 2025-06-12
    license: public agency data; see source terms
    verified: '2026-09-27'
    note: RFCW is a broad eGRID subregion and not the same geography or emissions-rate
      boundary as Cambium PJM_East; retained for historical reference only.
  fhwa_nhts_2017_annualization:
    name: '2017 National Household Travel Survey: Summary of Travel Trends, Table 30'
    publisher: Federal Highway Administration, U.S. Department of Transportation
    url: https://www.fhwa.dot.gov/policyinformation/documents/2017_nhts_summary_travel_trends.pdf
    access: manual
    vintage: 2017 NHTS; original (not adjusted) national per-driver daily VMT statistics
    license: public agency data; see source terms
    verified: '2026-09-27'
    note: National driver-level weekday/weekend ratio transferred to tract-level LATCH
      household weekday mean; denominator and geography do not match exactly. Ratio
      bounds are conservative endpoint propagation of Table 30 MOEs, not a formally
      estimated confidence interval for the ratio. 261 weekdays + 104 weekend days is
      a non-leap-year calendar decomposition.
  nrel_cambium_2024:
    name: Cambium 2024 Annual Data workbook
    publisher: National Renewable Energy Laboratory
    url: https://data.nlr.gov/submissions/289
    access: manual
    vintage: 2024 Cambium scenario release; projected values 2025–2050, source points
      every 5 years
    license: public agency data; see source terms
    verified: '2026-09-27'
    note: Cambium is a set of modeled futures, not a forecast; eight scenarios define
      model spread, not confidence intervals. Values are linearly interpolated between
      source points at five-year intervals. Workbook rates use end-use demand basis
      (average distribution losses included); do not add loss adjustment again. County
      mapping uses Cambium workbook crosswalk through ReEDS balancing area, not electric-meter
      service territory confirmation. Projection ends in 2050; the carbon model must
      explicitly hold the terminal value beyond 2050 or use a declared alternative sensitivity.
