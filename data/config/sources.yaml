    vintage: 2020–2024, 2024 ACS tract geography
    license: public domain
    verified: "2026-09-26"
    note: Key-free official table-based summary files B19013 and B25070; tract estimates and 90% margins of error. Rent-burden ratio bounds in Lotline are approximate, not Census-published MOEs.

  acs_2024_b25118:
    name: 2024 ACS Tenure by Household Income
    publisher: U.S. Census Bureau
