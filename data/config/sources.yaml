# Dataset registry. `access` tells the pipeline how to fetch:
#   ckan_datastore — WPRDC CKAN datastore_search on `resource_id`
#   ckan_download  — WPRDC CKAN resource file (URL resolved via resource_show)
#   manual         — no scripted access yet (see note)
# `verified` = URL and fields checked by hand on the date given.
ckan_api: https://data.wprdc.org/api/3/action

sources:
  wprdc_assessments:
    name: Allegheny County Property Assessments
    publisher: Allegheny County Office of Property Assessments via WPRDC
    url: https://data.wprdc.org/dataset/property-assessments
    access: ckan_datastore
    resource_id: 9a1c60bd-f9f7-4aba-aeb7-af8c3aaa44e5
    vintage: current extract (fetched at pipeline run)
    license: see WPRDC dataset page
    verified: "2026-09-26"
    note: Assessed/fair-market values are not market prices. Owner name and owner mailing address fields are never fetched.

  wprdc_parcel_centroids:
    name: Parcel Centroids in Allegheny County with Geographic Identifiers
    publisher: WPRDC
    url: https://data.wprdc.org/dataset/parcel-centroids-in-allegheny-county-with-geographic-identifiers
    access: ckan_datastore
    resource_id: 3fab7152-3f11-4788-8372-4c33f86ea813
    vintage: March 2025
    license: Creative Commons CCZero
    verified: "2026-09-26"
    note: Point per parcel with census tract, block group and city neighborhood. Centroid may fall outside irregular parcels.

  wprdc_city_owned:
    name: City-Owned Properties
    publisher: City of Pittsburgh via WPRDC
