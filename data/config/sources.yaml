# Dataset registry. `access` tells the pipeline how to fetch:
#   ckan_datastore — WPRDC CKAN datastore_search on `resource_id`
#   ckan_download  — WPRDC CKAN resource file (URL resolved via resource_show)
#   manual         — no scripted access yet (see note)
# `verified` = URL and fields checked by hand on the date given.
ckan_api: https://data.wprdc.org/api/3/action

sources:
  wprdc_assessments:
    name: Allegheny County Property Assessments
    publisher: Allegheny County Office of Property Assessments via WPRDC
    url: https://data.wprdc.org/dataset/property-assessments
    access: ckan_datastore
    resource_id: 9a1c60bd-f9f7-4aba-aeb7-af8c3aaa44e5
    vintage: current extract (fetched at pipeline run)
    license: see WPRDC dataset page
    verified: "2026-09-26"
    note: Assessed/fair-market values are not market prices. Owner name and owner mailing address fields are never fetched.

  wprdc_parcel_centroids:
    name: Parcel Centroids in Allegheny County with Geographic Identifiers
    publisher: WPRDC
    url: https://data.wprdc.org/dataset/parcel-centroids-in-allegheny-county-with-geographic-identifiers
    access: ckan_datastore
    resource_id: 3fab7152-3f11-4788-8372-4c33f86ea813
    vintage: March 2025
    license: Creative Commons CCZero
    verified: "2026-09-26"
    note: Point per parcel with census tract, block group and city neighborhood. Centroid may fall outside irregular parcels.

  wprdc_city_owned:
    name: City-Owned Properties
    publisher: City of Pittsburgh via WPRDC
    url: https://data.wprdc.org/dataset/city-owned-properties
    access: ckan_datastore
    resource_id: e1dcee82-9179-4306-8167-5891915b62a7
    vintage: current extract (fetched at pipeline run)
    license: see WPRDC dataset page
    verified: "2026-09-26"
    note: Ownership is not availability — check disposition status with the City / Land Bank.

  wprdc_zoning:
    name: Pittsburgh Zoning Districts
    publisher: City of Pittsburgh via WPRDC
    url: https://data.wprdc.org/dataset/zoning
    access: ckan_download
    resource_id: 6127f35e-f36b-4a53-80b3-f4409609e9df
    vintage: current extract (fetched at pipeline run)
    license: see WPRDC dataset page
    verified: "2026-09-26"
    note: Base districts only. Overlays (e.g., Riverfront, IPOD) are separate layers not yet joined.

  wprdc_neighborhoods:
    name: Pittsburgh Neighborhoods
    publisher: City of Pittsburgh via WPRDC
    url: https://data.wprdc.org/dataset/neighborhoods2
    access: ckan_download
    resource_id: 4af8e160-57e9-4ebf-a501-76ca1b42fc99
    vintage: current extract
    license: Creative Commons Attribution
    verified: "2026-09-26"

  wprdc_steep_slope:
    name: Pittsburgh 25% or Greater Slope
    publisher: City of Pittsburgh via WPRDC
    url: https://data.wprdc.org/dataset/25-or-greater-slope
    access: ckan_download
    resource_id: 5ce91a56-0799-46ea-9585-13fa8db5979e
    vintage: current extract
    license: see WPRDC dataset page
    verified: "2026-09-26"
    note: Derived threshold layer, tested at the parcel centroid only.

  wprdc_landslide_prone:
    name: Pittsburgh Landslide Prone Areas
    publisher: City of Pittsburgh via WPRDC
    url: https://data.wprdc.org/dataset/landslide-prone-areas
    access: ckan_download
    resource_id: b5b45ac6-f8ef-4805-b4e4-fc7c63fb4075
    vintage: current extract
    license: see WPRDC dataset page
    verified: "2026-09-26"
    note: Screening layer; tested at the parcel centroid only.

  wprdc_undermined:
    name: Pittsburgh Undermined Areas
    publisher: City of Pittsburgh via WPRDC
    url: https://data.wprdc.org/dataset/undermined-areas
    access: ckan_download
    resource_id: e1d96015-818f-46fb-88dd-85c20eacb96c
    vintage: current extract
    license: see WPRDC dataset page
    verified: "2026-09-26"
    note: Historic mine maps are incomplete; never a safety determination.

  pgh_zoning_code:
    name: Pittsburgh Code of Ordinances, Title Nine — Zoning Code
    publisher: City of Pittsburgh (hosted by General Code / eCode360)
    url: https://ecode360.com/45474054
    access: manual
    vintage: as amended (retrieval date recorded per rule)
    license: public law
    verified: "2026-09-26"

  pgh_zoning_map:
    name: Pittsburgh Zoning Map
    publisher: City of Pittsburgh
    url: https://pittsburghpa.maps.arcgis.com/apps/instant/sidebar/index.html?appid=4bb79ea64bf848b3a0560e3856efeccb
    access: manual
    vintage: live city map; verify before a site decision
    license: public map
    verified: "2026-09-26"
    note: Official map for checking district and overlays; Lotline's stored base district alone is not an approval determination.

  pgh_zoning_page:
    name: Pittsburgh City Planning Zoning Page
    publisher: City of Pittsburgh
    url: https://www.pittsburghpa.gov/Business-Development/City-Planning/Zoning
    access: manual
    vintage: live city guidance; verify before a site decision
    license: public page
    verified: "2026-09-26"
    note: City guidance and contact path for confirming site-specific zoning requirements.

  hud_income_limits:
    name: HUD FY2026 Income Limits (Pittsburgh, PA HMFA)
    publisher: U.S. Department of Housing and Urban Development
    url: https://www.huduser.gov/portal/datasets/il/il26/Section8-IncomeLimits-FY26.pdf
    access: manual
    vintage: FY2026; Pittsburgh HMFA METRO38300M38300
    license: public domain
    verified: "2026-09-26"
    note: Published area MFI is $110,400; four-person extremely low/very low/low limits are $33,100/$55,200/$88,300. Limits are not simple multiples of MFI.

  hud_chas:
    name: Comprehensive Housing Affordability Strategy (CHAS)
    publisher: HUD
    url: https://www.huduser.gov/portal/datasets/cp.html
    access: manual
    vintage: not yet retrieved
    license: public domain
    verified: false

  acs_5yr:
    name: 2024 American Community Survey 5-Year Detailed Tables
    publisher: U.S. Census Bureau
    url: https://www.census.gov/programs-surveys/acs/data/summary-file.html
    access: census_bulk
    vintage: 2020–2024, 2024 ACS tract geography
    license: public domain
    verified: "2026-09-26"
    note: Key-free official table-based summary files B19013 and B25070; tract estimates and 90% margins of error. Rent-burden ratio bounds in Lotline are approximate, not Census-published MOEs.

  allegheny_parcel_boundaries:
    name: Allegheny County Parcel Boundaries
    publisher: Allegheny County GIS
    url: https://gisdata.alleghenycounty.us/arcgis/rest/services/OPENDATA/Parcels/MapServer/0
    access: arcgis
    vintage: cached ArcGIS extract (remove raw cache to refetch)
    license: see Allegheny County GIS terms
    verified: "2026-09-26"
    note: PIN-matched polygons provide an interior sample point for mapped context. Vacant-lot outlines only are baked into web/public/data/basemap/lots.json for the 3D city; no other parcel geometry is published.

  wprdc_street_centerlines:
    name: Pittsburgh Street Centerline
    publisher: City of Pittsburgh via WPRDC
    url: https://data.wprdc.org/dataset/pittsburgh-street-centerlines
    access: ckan_download
    resource_id: 8a38a51d-5000-4600-8114-3f9e92202a64
    vintage: resource modified 2026-09-23
    license: Creative Commons CCZero
    verified: "2026-09-26"
    note: Drawn in the 3D city for orientation only (styled by domi_class); never used in any metric.

  pwsa_combined_sewersheds:
    name: PWSA Combined Sewersheds
    publisher: Pittsburgh Water and Sewer Authority via WPRDC
    url: https://data.wprdc.org/dataset/combined-sewershed
    access: ckan_download
    resource_id: 138d6b65-1630-4905-9421-de90cd9d59e5
    vintage: July 2018 resource
    license: Creative Commons Attribution
    verified: "2026-09-26"
    note: CSO_SHED identifies the mapped combined sewershed; outside the layer is not proof of a separate sewer or available capacity.

  prt_gtfs:
    name: Pittsburgh Regional Transit GTFS
    publisher: Pittsburgh Regional Transit via WPRDC
    url: https://data.wprdc.org/dataset/port-authority-of-allegheny-county-transit-data
    access: manual
    vintage: not yet retrieved
    license: see WPRDC dataset page
    verified: false

  umn_aaa_transit:
    name: Access Across America Transit 2024
    publisher: University of Minnesota Accessibility Observatory
    url: https://access.umn.edu/ao-research/aaa/transit/2024
    access: manual
    vintage: 2024 travel-time analysis; report published 2025
    license: verify dataset reuse terms
    verified: false
    note: The report describes block-level jobs reachable by transit, but the linked data repository returned 403/401 on 2026-09-26. No parcel or tract values were extracted; request access or locate an authorized download before replacing jobs_access_index.

  fema_nfhl:
    name: FEMA National Flood Hazard Layer, Pennsylvania
    publisher: FEMA via Pennsylvania Spatial Data Access
    url: https://pasda.psu.edu/uci/DataSummary.aspx?dataset=2365
    access: arcgis
    vintage: July 2026 Pennsylvania extract
    license: public domain
    verified: "2026-09-26"
    note: A point inside each available parcel polygon is tested against the mapped flood zones. Partial-lot hazards can be missed; verify the map panel for a site decision.

  alcosan_cso:
    name: ALCOSAN / PWSA combined sewer overflow data
    publisher: ALCOSAN / PWSA
    url: null
    access: manual
    vintage: not yet retrieved
    license: unknown
    verified: false

  epa_egrid:
    name: EPA eGRID2023 summary tables (rev 2)
    publisher: U.S. EPA
    url: https://www.epa.gov/system/files/documents/2025-06/summary_tables_rev2.pdf
    access: manual
    vintage: eGRID2023 (2023 data, published 2025)
    license: public domain
    verified: "2026-09-26"
    note: Table 1 (subregion output emission rates, RFCW) and Table 3 (state rates, PA).

  hud_tdc_2024:
    name: HUD 2024 Unit Total Development Cost (TDC) and Housing Construction Cost (HCC) limits
    publisher: U.S. Department of Housing and Urban Development, Office of Public and Indian Housing
    url: https://www.hud.gov/sites/dfiles/PIH/documents/2024_Units_TDC_Limits.pdf
    access: manual
    vintage: "2024"
    license: public domain
    verified: "2026-09-26"
    note: Region III, Pennsylvania, Pittsburgh rows. Limits (caps) for public housing development, used as a cost benchmark.

  epa_smart_location:
    name: EPA Smart Location Database
    publisher: U.S. EPA
    url: https://services1.arcgis.com/IqEe3YDHhqT8n4KU/ArcGIS/rest/services/EPA_SmartLocationDatabase_V3_Jan_2021_Final/FeatureServer/0
    access: arcgis
    vintage: 2021 SLD 3.0; 2020 GTFS and travel times; 2017 LEHD; GEOID20 block groups
    license: public domain
    verified: "2026-09-27"
    note: D5DRI is transit job accessibility relative to the highest block group in the CBSA (0–1); D5BR is distance-decay-weighted jobs reachable within 45 minutes by transit. It is a site context measure, not household VMT.

  epa_ghg_factors:
    name: EPA Greenhouse Gas Emission Factors Hub and Equivalencies Calculator
    publisher: U.S. EPA
    url: https://www.epa.gov/energy/greenhouse-gas-equivalencies-calculator-calculations-and-references
    access: manual
    vintage: 2022 average passenger-vehicle fleet baseline (published in EPA's current references)
    license: public domain
    verified: "2026-09-27"
    note: 0.393 kg CO2e per vehicle-mile is an average U.S. passenger-vehicle tailpipe proxy; it does not specify Pittsburgh household VMT.

  nrel_resstock:
    name: ResStock
    publisher: U.S. DOE / NREL
    url: https://resstock.nrel.gov/
    access: manual
    vintage: not yet retrieved
    license: public
    verified: false

  aws_terrain_tiles:
    name: Terrain Tiles (Terrarium PNG)
    publisher: Mapzen / Amazon Web Services Open Data (derived from USGS 3DEP, SRTM and others)
    url: https://registry.opendata.aws/terrain-tiles/
    access: manual
    vintage: tiles last modified 2017
    license: see registry page; attribution to the underlying sources required
    verified: "2026-09-26"
    note: Used only to shape the stylized 3D city. Baked into web/public/data/terrain.bin by pipeline/build_terrain.py; never used in any metric.
