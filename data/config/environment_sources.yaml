schema_version: 1
sources:
  bts_latch_2017:
    publisher: Bureau of Transportation Statistics, U.S. Department of Transportation
    title: Local Area Transportation Characteristics by Household 2017
    url: https://catalog.data.gov/dataset/local-area-transportation-characteristics-by-household-2017
    download_url: https://data.transportation.gov/api/v3/views/va72-z8hz/export.csv?accessType=DOWNLOAD
    vintage: 2017
    geography: Census tract (2010 tract vintage)
    measures: modeled average weekday household VMT, vehicle trips, person trips, person miles
    license: U.S. Government public data; verify individual catalog terms at snapshot time
    ingestion: pipeline.environment_inputs.read_latch_tract_vmt
    annualization: Must retain selected household profile and explicit weekday/weekend factors calibrated to matching NHTS. Preserve suppression/imprecision flags.
    status: source_available_ingestion_adapter_ready
  doe_pnnl_iecc_2021:
    publisher: U.S. Department of Energy, Building Energy Codes Program; Pacific Northwest National Laboratory
    title: Residential Prototype Building Models, 2021 IECC
    url: https://www.energycodes.gov/prototype-building-models
    vintage: 2021 IECC prototype; model package published 2024
    geography: Climate zone 5A proxy for Pittsburgh; verify the code basis before use
    measures: Simulated site energy by prototype, HVAC/fuel, and foundation
    license: Public agency model files; retain source notices and package checksum
    status: source_available_parser_required
    limitation: Base prototypes cover single-family detached and low-rise multifamily; Lotline rowhouse/duplex are approximations and commercial midrise is a separate model.
  epa_egrid_2023:
    publisher: U.S. Environmental Protection Agency
    title: eGRID 2023, revision 2
    url: https://www.epa.gov/egrid/summary-data
    vintage: 2023 emissions, revision released 2025-06-12
    geography: eGRID subregion; RFC West (RFCW) and Pennsylvania statewide values are context/scenario choices
    measures: Average output emission rates and generation/emissions attributes
    license: U.S. Government public data; retain source notices and package checksum
    status: published_rate_referenced_in_current_assumptions; snapshot_ingestion_pending
    limitation: Historical average rate is an anchor, not an hourly marginal rate or forecast.
  nrel_cambium:
    publisher: National Renewable Energy Laboratory
    title: Cambium long-term electricity-sector scenarios
    url: https://data.nlr.gov/submissions/289
    vintage: Select and record downloaded release/scenario/year horizon
    geography: Model balancing area / region; validate mapping for western Pennsylvania
    measures: Annual average emissions trajectories; marginal series only for consequential change analyses
    license: Check selected submission terms and attribution requirements
    ingestion: pipeline.environment_inputs.build_annual_grid_path
    status: source_available_ingestion_adapter_ready_download_and_mapping_pending
    limitation: Model scenario, not parcel forecast; never extrapolate silently beyond its year horizon.
  material_quantity_prototype:
    publisher: Lotline declared scenario, with DOE whole-building LCA guidance
    title: Typology material-quantity schedule × declared life-cycle factors
    url: https://www.energy.gov/sites/default/files/2024-02/bto-abc-embodied-carbon-022624.pdf
    vintage: Scenario version must be recorded with quantity and factor snapshots
    geography: Prototype typology, not parcel
    measures: kgCO2e by material and life-cycle stage
    license: Factors require EPD/LCI source-specific rights; do not use EC3 API data without suitable terms
    ingestion: pipeline.environment_inputs.embodied_carbon_from_schedule
    status: calculation_adapter_ready_no_quantities_or_factors_ingested
    limitation: No design-specific bill of quantities; report A1-A3 and A4-A5 boundaries separately when present.
  pa_dep_design_flow:
    publisher: Pennsylvania Department of Environmental Protection
    title: Domestic Wastewater Facilities Manual
    url: https://greenport.pa.gov/elibrary/PDFProvider.ashx?PromptToSave=False&Size=789525&ViewerMode=2&action=PDFStream&docID=9232038&docName=DOMESTIC+WASTEWATER+FACILITIES+MANUAL&nativeExt=pdf&overlay=0&revision=0
    vintage: Manual revision/cover date requires verification at use
    geography: Proposed project, by declared occupancy / use assumptions
    measures: §24.1 p.22 average daily design flow reference of at least 100 gpd/person unless rigorously justified; includes normal infiltration
    license: Public agency guidance; cite revision and table/section used
    status: cited_reference_configured_for_scenario_model
    limitation: The 100 gpd/person design reference is not measured household discharge, parcel flow, or sewer capacity. Avoid §73.17 as it excludes community sewerage systems.
  pwsa_sewershed:
    publisher: Pittsburgh Water and Sewer Authority / Western Pennsylvania Regional Data Center
    title: Combined sewershed mapping
    url: https://data.wprdc.org/dataset/combined-sewershed
    vintage: Verify latest dataset snapshot
    geography: Mapped sewershed overlay
    measures: Spatial context only
    license: Verify at snapshot time
    status: existing_pipeline_context_possible_join_pending
    limitation: Membership does not establish outfall linkage or available capacity.
  alcosan_historical_overflow:
    publisher: Allegheny County Sanitary Authority
    title: Clean Water Plan, Section 4 overflow context
    url: https://www.alcosan.org/docs/default-source/clean-water-plan-documents/cwp-section-4.pdf?sfvrsn=6d0d892a_2
    vintage: Historical report; exact observation period must be carried into every record
    geography: Facility/outfall only after validated mapping
    measures: Historical overflow volume/frequency where stated
    license: Public agency report
    status: source_document_available_outfall_mapping_pending
    limitation: Historical overflow is not a parcel impact estimate or a current capacity finding.
