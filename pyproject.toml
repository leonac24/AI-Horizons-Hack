[project]
name = "lotline"
version = "0.1.0"
description = "Pittsburgh housing typology, equity & climate matchmaker (decision support)"
requires-python = ">=3.12"
# Runtime deps only — this is what the Vercel function bundles. Keep it small.
dependencies = [
    "fastapi>=0.117",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=2.1",
    "anthropic>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
# Offline data pipeline (never deployed).
pipeline = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "requests>=2.32",
    "pillow>=12.3.0",
]

[tool.uv]
# The pipeline group (GeoPandas…) is opt-in so hosting installs stay small:
#   uv sync --group pipeline
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
