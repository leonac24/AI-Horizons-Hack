citywide:
  uses:
    single_unit_detached_with_adu:
      status: not_permitted
      code_section: '912.08'
      quote: the intent of this Section to permit the construction and operation of Accessory Dwelling Units, as defined in
        Section 912.08.D, in certain districts
      confidence: 0.9
      retrieved: '2026-09-26'
      extracted_by: manual read of eCode360 § 912.08 — not LLM extraction
      reviewed: true
      reviewed_on: '2026-09-26'
      note: 'Pittsburgh permits accessory dwelling units only inside an adopted Accessory Dwelling Unit Overlay District (§
        912.08, Ord. No. 32-2018). The overlay is not a base district — it has to be adopted for an area under § 922.05, and
        an interim one lapses after 24 months. No such overlay is currently mapped: the City''s zoning overlay layer carries
        127 overlay types and none is an ADU overlay. So the mechanism exists in the code but has not been applied anywhere,
        and an ADU cannot be permitted on any lot in the city today. If an overlay were adopted here, § 912.08.E would exempt
        the unit from the underlying district''s minimum lot size and lot-area-per-unit rules, and cap it at 800 sq ft, 2
        stories and 30 feet. Checked 2026-09-26 against the City''s published overlay layer; confirm with the Department of
        City Planning.'
